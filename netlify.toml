[build]
  publish = "."
  functions = "netlify/functions"

# The editor: same page, with edit.js switched on.
[[redirects]]
  from = "/edit"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/edit"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
